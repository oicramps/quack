name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

# `build` makes every artifact once; each target then publishes in its own job,
# so one failing target doesn't block the others. Every publish job skips work
# that's already done, so "Re-run failed jobs" retries the same version.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Check version and determine if release is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('shared/src/constants.ts','utf8').match(/QUACK_VERSION\s*=\s*'([^']+)'/); if(!m) process.exit(1); console.log(m[1]);")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Sync package.json versions (and internal @quack/* deps) if someone bumped QUACK_VERSION alone
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const p of ["package.json", "shared/package.json", "companion/package.json", "extension/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              pkg.version = v;
              if (pkg.dependencies?.["@quack/shared"]) pkg.dependencies["@quack/shared"] = v;
              if (pkg.devDependencies?.["@quack/shared"]) pkg.devDependencies["@quack/shared"] = v;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$VERSION"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On push/merge to main: release only if GitHub Release for this version does not exist yet
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release steps."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected on main; running release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.should_release == 'true'
        run: yarn install --frozen-lockfile

      - if: steps.check.outputs.should_release == 'true'
        run: yarn test

      - if: steps.check.outputs.should_release == 'true'
        run: yarn typecheck

      - name: Build companion and installer assets
        if: steps.check.outputs.should_release == 'true'
        run: |
          yarn workspace quack-companion build
          mkdir -p release
          cp companion/dist/quack-companion.cjs release/quack-companion.cjs
          sed "s|__COMPANION_REPO__|${GITHUB_REPOSITORY}|g" companion/scripts/install.sh > release/install.sh
          chmod +x release/install.sh
          (cd release && sha256sum quack-companion.cjs > quack-companion.cjs.sha256)
          yarn --cwd companion pack --filename "$PWD/release/quack-companion.tgz"

      - name: Build extension zips
        if: steps.check.outputs.should_release == 'true'
        run: |
          yarn workspace @quack/extension zip
          yarn workspace @quack/extension zip -b edge
          cp extension/.output/store/quackextension-*-chrome.zip release/
          cp extension/.output/store/quackextension-*-edge.zip release/

      - if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  github-release:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "$TAG"
          fi

  npm:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      # No registry-url: setup-node would write a placeholder token that npm
      # falls back to whenever the Trusted Publishing exchange fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish quack-companion to npm (Trusted Publishing)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Trusted Publishing needs npm 11.5.1+.
          npm install -g npm@^11.5.1
          PUBLISHED=$(npm view "quack-companion@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "quack-companion@${VERSION} is already published; skipping."
            exit 0
          fi
          # Verbose output includes the Trusted Publishing (OIDC) exchange, which is
          # the only place npm says why it fell back to anonymous and got a 404.
          npm publish ./release/quack-companion.tgz --access public --provenance --loglevel verbose

  # GitHub's Packages tab only lists GitHub Packages, not npmjs.
  # The npm registry requires a scope that matches the repository owner.
  github-packages:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish quack-companion to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          SCOPE="@${OWNER}/quack-companion"
          PUBLISHED=$(npm view "${SCOPE}@${VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "${SCOPE}@${VERSION} is already on GitHub Packages; skipping."
            exit 0
          fi
          STAGE=$(mktemp -d)
          tar -xzf release/quack-companion.tgz -C "$STAGE"
          node -e '
            const fs = require("fs");
            const pkgPath = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.name = process.argv[2];
            pkg.repository = {
              type: "git",
              url: "https://github.com/" + process.env.GITHUB_REPOSITORY + ".git",
              directory: "companion",
            };
            pkg.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          ' "$STAGE/package/package.json" "$SCOPE"
          npm publish "$STAGE/package" --registry https://npm.pkg.github.com --access public

  chrome:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Submit to Chrome Web Store
        working-directory: extension
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ] || [ -z "$CHROME_CLIENT_ID" ]; then
            echo "Chrome Web Store secrets not configured; skipping store submission."
            exit 0
          fi
          # `wxt submit` is the Chrome Web Store client. It has no "already uploaded"
          # flag, so a repeat of the same version (or a review still pending) is a skip.
          set +e
          output=$(yarn wxt submit --chrome-zip ../release/quackextension-*-chrome.zip 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && printf '%s\n' "$output" | grep -Eq 'ITEM_PENDING_REVIEW|ITEM_NOT_UPDATABLE|PKG_INVALID_VERSION_NUMBER'; then
            echo "Chrome Web Store already has this version, or a review is still pending; skipping."
            exit 0
          fi
          exit "$status"

  edge:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Submit to Edge Add-ons
        working-directory: extension
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          if [ -z "$EDGE_PRODUCT_ID" ] || [ -z "$EDGE_CLIENT_ID" ]; then
            echo "Edge Add-ons secrets not configured; skipping store submission."
            exit 0
          fi
          yarn wxt submit --edge-zip ../release/quackextension-*-edge.zip
